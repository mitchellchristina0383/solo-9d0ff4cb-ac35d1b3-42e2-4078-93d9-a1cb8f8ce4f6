services:
  rehearsal:
    build:
      context: .
      dockerfile: Dockerfile
    image: shared-deployment-rehearsal:latest
    container_name: shared-deployment-rehearsal
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/rehearsal.db
    volumes:
      - rehearsal-sqlite:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  rehearsal-sqlite:
